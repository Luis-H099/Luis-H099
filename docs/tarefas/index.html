<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TarefasApp | Demonstração</title><style>
*{box-sizing:border-box}body{margin:0;background:#121820;color:#e5e7eb;font:15px/1.5 system-ui,Arial}.nav{background:#1c2633;border-bottom:1px solid #344151;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.nav b{font-size:20px}.nav a{color:#a9b9cc;text-decoration:none}.wrap{max-width:1100px;margin:34px auto;padding:0 18px}.welcome{padding:22px 26px;background:#202c3a;border-radius:13px;margin-bottom:25px}.welcome h1{margin:0 0 6px}.muted{color:#a1adbb}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{background:#198754;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}.btn:hover{background:#157347}.filters{display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:12px;margin:18px 0}.filters label{display:block;color:#aeb9c7;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border-radius:7px;border:1px solid #475569;background:#1d2937;color:#e5e7eb}table{width:100%;border-collapse:collapse;background:#1b2633;border-radius:10px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #344151}th{background:#263443;color:#cbd5e1;font-size:13px}td{color:#dbe3ec}.status{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;background:#475569}.concluida{background:#14532d}.cancelada{background:#7f1d1d}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid #526274;background:transparent;color:#dbeafe;cursor:pointer}.actions .danger{color:#fecaca}.empty{text-align:center;padding:25px;color:#aab7c5}.note{margin:16px 0;padding:11px 14px;border:1px solid #526274;border-radius:8px;color:#cbd5e1}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{width:min(500px,100%);background:#202c3a;border:1px solid #475569;border-radius:12px;padding:22px}.dialog label{display:block;margin:12px 0 5px}.dialog textarea{min-height:85px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{background:#475569}@media(max-width:750px){.filters{grid-template-columns:1fr}table{display:block;overflow-x:auto}}</style></head><body><nav class="nav"><b>TarefasApp</b><a href="../">Todas as demonstrações</a></nav><main class="wrap"><section class="welcome"><h1>Bem-vindo(a) 👋</h1><p class="muted">Organize suas tarefas em um só lugar.</p></section><div class="bar"><div><h2 style="margin:0">Tarefas</h2><span class="muted">Gerencie suas atividades</span></div><button class="btn" id="new">+ Incluir tarefa</button></div><div class="filters"><div><label>Status</label><select id="status"><option value="todas">Todas</option><option value="pendente">Pendentes</option><option value="concluida">Concluídas</option><option value="cancelada">Canceladas</option></select></div><div><label>Buscar (título/descrição)</label><input id="search" placeholder="Ex.: prova, pagamento, reunião..."></div><div><label>Ordenar por</label><select id="sort"><option value="data_asc">Data prevista (mais antigas)</option><option value="data_desc">Data prevista (mais recentes)</option><option value="titulo_asc">Título (A–Z)</option><option value="titulo_desc">Título (Z–A)</option><option value="status">Status</option></select></div></div><div class="note">Demonstração estática: as tarefas ficam somente neste navegador (localStorage).</div><table><thead><tr><th>Título</th><th>Descrição</th><th>Data prevista</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></main><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Nova tarefa</h2><input type="hidden" id="taskId"><label>Título</label><input id="title" required><label>Descrição</label><textarea id="desc"></textarea><label>Data prevista</label><input type="date" id="date"><div class="foot"><button class="btn secondary" id="close">Fechar</button><button class="btn" id="save">Salvar</button></div></div></div><script>
const $=s=>document.querySelector(s),KEY='tarefas_demo_v1';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch{}if(!tasks.length)tasks=[{id:'1',titulo:'Estudar JavaScript',descricao:'Revisar funções e exercícios',dataPrevista:new Date(Date.now()+86400000).toISOString().slice(0,10),status:'pendente'},{id:'2',titulo:'Entregar atividade',descricao:'Finalizar documentação do projeto',dataPrevista:new Date(Date.now()+172800000).toISOString().slice(0,10),status:'concluida'},{id:'3',titulo:'Organizar arquivos',descricao:'Separar materiais da faculdade',dataPrevista:new Date().toISOString().slice(0,10),status:'cancelada'}];function persist(){localStorage.setItem(KEY,JSON.stringify(tasks))}function render(){let a=[...tasks],st=$('#status').value,q=$('#search').value.toLowerCase(),sort=$('#sort').value;if(st!=='todas')a=a.filter(x=>x.status===st);a=a.filter(x=>(x.titulo+x.descricao).toLowerCase().includes(q));if(sort==='data_asc')a.sort((x,y)=>x.dataPrevista.localeCompare(y.dataPrevista));if(sort==='data_desc')a.sort((x,y)=>y.dataPrevista.localeCompare(x.dataPrevista));if(sort==='titulo_asc')a.sort((x,y)=>x.titulo.localeCompare(y.titulo));if(sort==='titulo_desc')a.sort((x,y)=>y.titulo.localeCompare(x.titulo));if(sort==='status')a.sort((x,y)=>x.status.localeCompare(y.status));$('#rows').innerHTML=a.length?a.map(t=>'<tr><td>'+esc(t.titulo)+'</td><td>'+esc(t.descricao)+'</td><td>'+t.dataPrevista.split('-').reverse().join('/')+'</td><td><span class="status '+t.status+'">'+t.status+'</span></td><td><div class="actions"><button data-act="edit" data-id="'+t.id+'">Editar</button><button data-act="done" data-id="'+t.id+'">Concluir</button><button class="danger" data-act="cancel" data-id="'+t.id+'">Cancelar</button></div></td></tr>').join(''):'<tr><td colspan="5" class="empty">Nenhuma tarefa encontrada.</td></tr>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function open(t){$('#taskId').value=t?.id||'';$('#title').value=t?.titulo||'';$('#desc').value=t?.descricao||'';$('#date').value=t?.dataPrevista||new Date().toISOString().slice(0,10);$('#modalTitle').textContent=t?'Editar tarefa':'Nova tarefa';$('#modal').classList.add('open')}function close(){$('#modal').classList.remove('open')}$('#new').onclick=()=>open();$('#close').onclick=close;$('#save').onclick=()=>{let titulo=$('#title').value.trim(),descricao=$('#desc').value.trim(),dataPrevista=$('#date').value;if(!titulo||!descricao||!dataPrevista){alert('Preencha todos os campos.');return}let id=$('#taskId').value;if(id){let t=tasks.find(x=>x.id===id);Object.assign(t,{titulo,descricao,dataPrevista})}else tasks.push({id:crypto.randomUUID(),titulo,descricao,dataPrevista,status:'pendente'});persist();render();close()};$('#rows').onclick=e=>{let b=e.target.closest('button');if(!b)return;let t=tasks.find(x=>x.id===b.dataset.id);if(b.dataset.act==='edit')open(t);if(b.dataset.act==='done')t.status='concluida';if(b.dataset.act==='cancel')t.status='cancelada';persist();render()};['#status','#search','#sort'].forEach(s=>$(s).addEventListener(s==='#search'?'input':'change',render));render();
</script></body></html>
